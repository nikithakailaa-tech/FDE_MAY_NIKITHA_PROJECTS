<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Complaint Tracker</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<nav class="navbar">
    <h1>Complaint Tracker</h1>
    <div class="navbar-links">
        <a href="/app/dashboard">Dashboard</a>
        <a href="/app/complaints">Complaints</a>
        <a href="/app/new-complaint">New Complaint</a>
        <a href="/app/feedback">Feedback</a>
        <a href="/app/reports">Reports</a>
        <a href="/app/profile">Profile</a>
        <a href="/app/agent-queue" id="queue-link" style="display:none">Agent Queue</a>
        <a href="/app/escalation" id="escalation-link" style="display:none">Escalation</a>
        <a href="/app/admin" class="active">Admin</a>
        <div class="notif-wrapper">
            <button class="notif-btn" onclick="toggleNotificationDropdown()">
                🔔<span id="notif-badge"></span>
            </button>
            <div id="notif-panel"></div>
        </div>
        <a href="#" onclick="logout()" style="margin-left:8px;">Logout</a>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h2>Admin Panel</h2>
        <span id="admin-role-badge" class="role-badge role-admin">Admin</span>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('users')">👥 User Management</button>
        <button class="tab-btn" onclick="switchTab('categories')">🏷️ Categories</button>
    </div>

    <!-- Users Tab -->
    <div id="tab-users">
        <div class="table-container">
            <div class="table-header">
                <h3>All Users</h3>
                <span id="user-count" style="font-size:13px;color:#888;"></span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Joined</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="users-body">
                    <tr><td colspan="7" style="text-align:center;padding:30px;color:#999;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Categories Tab -->
    <div id="tab-categories" style="display:none;">
        <div class="card">
            <h3>Add New Category</h3>
            <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;">
                <div class="form-group" style="flex:1;min-width:180px;margin-bottom:0;">
                    <label>Category Name</label>
                    <input type="text" id="cat-name" placeholder="e.g. Network Issues">
                </div>
                <div class="form-group" style="flex:2;min-width:240px;margin-bottom:0;">
                    <label>Description</label>
                    <input type="text" id="cat-desc" placeholder="Brief description...">
                </div>
                <button class="btn btn-success" onclick="addCategory()" style="width:auto;height:40px;">Add</button>
            </div>
            <div id="cat-alert" style="margin-top:12px;"></div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h3>All Categories</h3>
            </div>
            <table>
                <thead>
                    <tr><th>#</th><th>Name</th><th>Description</th><th>Action</th></tr>
                </thead>
                <tbody id="categories-body">
                    <tr><td colspan="4" style="text-align:center;padding:30px;color:#999;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Edit Role Modal -->
<div class="modal-overlay" id="role-modal">
    <div class="modal" style="width:380px;">
        <button class="modal-close" onclick="closeRoleModal()">✕</button>
        <h3>Change User Role</h3>
        <input type="hidden" id="role-user-id">
        <p id="role-user-name" style="color:#555;font-size:14px;margin-bottom:16px;"></p>
        <div class="form-group">
            <label>New Role</label>
            <select id="new-role">
                <option value="customer">Customer</option>
                <option value="agent">Support Agent</option>
                <option value="supervisor">Supervisor</option>
                <option value="admin">Admin</option>
            </select>
        </div>
        <div id="role-alert"></div>
        <button class="btn btn-primary" onclick="submitRoleChange()">Update Role</button>
    </div>
</div>

<script src="/static/js/api.js"></script>
<script>
let currentTab = "users";

window.onload = async function () {
    requireAuth();
    loadNotificationBadge();
    const me = await getMe();
    if (me.role !== "admin" && me.role !== "supervisor") {
        window.location.href = "/app/dashboard";
        return;
    }
    document.getElementById("queue-link").style.display = "inline";
    document.getElementById("escalation-link").style.display = "inline";
    if (me.role === "supervisor") {
        document.getElementById("admin-role-badge").className = "role-badge role-supervisor";
        document.getElementById("admin-role-badge").textContent = "Supervisor";
    }
    await loadUsers();
    await loadCategories();
};

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll(".tab-btn").forEach((btn, i) => {
        btn.classList.toggle("active", (i === 0 && tab === "users") || (i === 1 && tab === "categories"));
    });
    document.getElementById("tab-users").style.display = tab === "users" ? "block" : "none";
    document.getElementById("tab-categories").style.display = tab === "categories" ? "block" : "none";
}

async function loadUsers() {
    try {
        const users = await getAllUsers();
        document.getElementById("user-count").textContent = `${users.length} user(s)`;
        const tbody = document.getElementById("users-body");
        if (!users.length) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;color:#999;">No users found</td></tr>`;
            return;
        }
        tbody.innerHTML = users.map(u => `
            <tr>
                <td>${u.id}</td>
                <td><strong>${u.name}</strong></td>
                <td style="font-size:13px;">${u.email}</td>
                <td><span class="role-badge role-${u.role}">${u.role}</span></td>
                <td><span style="color:${u.is_active ? '#2e7d32' : '#c62828'};font-weight:600;font-size:12px;">${u.is_active ? "Active" : "Inactive"}</span></td>
                <td style="font-size:12px;color:#888;">${new Date(u.created_at).toLocaleDateString()}</td>
                <td style="display:flex;gap:6px;">
                    <button class="btn btn-warning btn-sm" onclick="openRoleModal(${u.id}, '${u.name.replace(/'/g,"\\'")}', '${u.role}')">Role</button>
                    <button class="btn btn-${u.is_active ? 'danger' : 'success'} btn-sm" onclick="toggleActive(${u.id}, this)">${u.is_active ? "Deactivate" : "Activate"}</button>
                </td>
            </tr>
        `).join("");
    } catch (e) { console.error(e); }
}

async function loadCategories() {
    try {
        const cats = await getCategories();
        const tbody = document.getElementById("categories-body");
        if (!cats.length) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:30px;color:#999;">No categories</td></tr>`;
            return;
        }
        tbody.innerHTML = cats.map(c => `
            <tr>
                <td>${c.id}</td>
                <td><strong>${c.name}</strong></td>
                <td style="font-size:13px;color:#555;">${c.description || "—"}</td>
                <td><button class="btn btn-danger btn-sm" onclick="removeCategory(${c.id}, this)">Delete</button></td>
            </tr>
        `).join("");
    } catch (e) { console.error(e); }
}

async function addCategory() {
    const name = document.getElementById("cat-name").value.trim();
    const description = document.getElementById("cat-desc").value.trim();
    const alertEl = document.getElementById("cat-alert");
    if (!name) { alertEl.innerHTML = `<div class="alert alert-error">Category name is required</div>`; return; }
    try {
        const data = await createCategory(name, description);
        if (data.id) {
            alertEl.innerHTML = `<div class="alert alert-success">Category added!</div>`;
            document.getElementById("cat-name").value = "";
            document.getElementById("cat-desc").value = "";
            await loadCategories();
        } else {
            alertEl.innerHTML = `<div class="alert alert-error">${data.detail || "Failed"}</div>`;
        }
    } catch (e) { alertEl.innerHTML = `<div class="alert alert-error">Error occurred</div>`; }
}

async function removeCategory(id, btn) {
    if (!confirm("Delete this category? This may affect existing complaints.")) return;
    try {
        await deleteCategory(id);
        await loadCategories();
    } catch (e) { alert("Failed to delete"); }
}

async function toggleActive(userId, btn) {
    try {
        const data = await toggleUserActive(userId);
        await loadUsers();
    } catch (e) { alert("Failed"); }
}

function openRoleModal(id, name, currentRole) {
    document.getElementById("role-user-id").value = id;
    document.getElementById("role-user-name").textContent = `User: ${name}`;
    document.getElementById("new-role").value = currentRole;
    document.getElementById("role-alert").innerHTML = "";
    document.getElementById("role-modal").classList.add("active");
}

function closeRoleModal() { document.getElementById("role-modal").classList.remove("active"); }

async function submitRoleChange() {
    const id = document.getElementById("role-user-id").value;
    const role = document.getElementById("new-role").value;
    const alertEl = document.getElementById("role-alert");
    try {
        const data = await updateUserRole(id, role);
        if (data.role) {
            alertEl.innerHTML = `<div class="alert alert-success">Role updated!</div>`;
            setTimeout(() => { closeRoleModal(); loadUsers(); }, 900);
        } else {
            alertEl.innerHTML = `<div class="alert alert-error">${data.detail || "Failed"}</div>`;
        }
    } catch (e) { alertEl.innerHTML = `<div class="alert alert-error">Error occurred</div>`; }
}

document.getElementById("role-modal").addEventListener("click", e => {
    if (e.target === document.getElementById("role-modal")) closeRoleModal();
});
</script>
</body>
</html>
