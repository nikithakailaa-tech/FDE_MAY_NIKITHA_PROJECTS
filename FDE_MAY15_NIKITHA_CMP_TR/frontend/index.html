<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Complaint Tracker</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box" style="position:relative;">
            <button onclick="document.querySelector('.auth-container').style.display='none'" style="position:absolute;top:12px;right:14px;background:none;border:none;font-size:20px;color:#aaa;cursor:pointer;line-height:1;" title="Close">✕</button>
            <h2>Complaint Tracker</h2>
            <p>Sign in to your account</p>

            <div id="alert-box"></div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" onkeydown="if(event.key==='Enter') handleLogin()">
            </div>

            <button class="btn btn-primary" onclick="handleLogin()">Sign In</button>

            <p style="text-align:center;margin-top:20px;font-size:14px;color:#666;">
                Don't have an account?
                <a href="/app/register" style="color:#1a73e8;font-weight:600;">Register here</a>
            </p>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
