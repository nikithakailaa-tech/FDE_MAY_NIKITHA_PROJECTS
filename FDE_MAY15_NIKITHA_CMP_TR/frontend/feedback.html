<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Complaint Tracker</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<nav class="navbar">
    <h1>Complaint Tracker</h1>
    <div class="navbar-links">
        <a href="/app/dashboard">Dashboard</a>
        <a href="/app/complaints">Complaints</a>
        <a href="/app/new-complaint">New Complaint</a>
        <a href="/app/feedback" class="active">Feedback</a>
        <a href="/app/reports">Reports</a>
        <a href="/app/profile">Profile</a>
        <a href="/app/agent-queue" id="queue-link" style="display:none">Agent Queue</a>
        <a href="/app/escalation" id="escalation-link" style="display:none">Escalation</a>
        <a href="/app/admin" id="admin-link" style="display:none">Admin</a>
        <div class="notif-wrapper">
            <button class="notif-btn" onclick="toggleNotificationDropdown()">
                🔔<span id="notif-badge"></span>
            </button>
            <div id="notif-panel"></div>
        </div>
        <a href="#" onclick="logout()" style="margin-left:8px;">Logout</a>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h2>Feedback & Ratings</h2>
    </div>

    <!-- Pending Feedback -->
    <div class="card">
        <h3>Rate Resolved Complaints</h3>
        <div id="pending-feedback">
            <p style="color:#888;font-size:14px;">Loading resolved complaints...</p>
        </div>
    </div>

    <!-- Submitted Feedback -->
    <div class="card">
        <h3>Submitted Feedback</h3>
        <div id="submitted-feedback">
            <p style="color:#888;font-size:14px;">Loading...</p>
        </div>
    </div>
</div>

<!-- Feedback Modal -->
<div class="modal-overlay" id="feedback-modal">
    <div class="modal">
        <button class="modal-close" onclick="closeFeedbackModal()">✕</button>
        <h3>Rate Your Experience</h3>
        <input type="hidden" id="fb-complaint-id">
        <p id="fb-complaint-title" style="color:#555;font-size:14px;margin-bottom:16px;"></p>

        <div class="form-group">
            <label>Rating</label>
            <div class="star-rating">
                <input type="radio" id="s5" name="rating" value="5"><label for="s5">★</label>
                <input type="radio" id="s4" name="rating" value="4"><label for="s4">★</label>
                <input type="radio" id="s3" name="rating" value="3"><label for="s3">★</label>
                <input type="radio" id="s2" name="rating" value="2"><label for="s2">★</label>
                <input type="radio" id="s1" name="rating" value="1"><label for="s1">★</label>
            </div>
        </div>
        <div class="form-group">
            <label>Comments (optional)</label>
            <textarea id="fb-comments" rows="3" placeholder="Share your experience..."></textarea>
        </div>
        <div id="fb-alert"></div>
        <button class="btn btn-primary" onclick="submitFeedbackForm()">Submit Feedback</button>
    </div>
</div>

<script src="/static/js/api.js"></script>
<script>
let resolvedWithoutFeedback = [];
let submittedFeedbacks = [];

window.onload = async function () {
    requireAuth();
    loadNotificationBadge();
    const me = await getMe();
    if (me.role !== "customer") document.getElementById("queue-link").style.display = "inline";
    if (me.role === "admin" || me.role === "supervisor") {
        document.getElementById("admin-link").style.display = "inline";
        document.getElementById("escalation-link").style.display = "inline";
    }
    await loadFeedbackData();
};

async function loadFeedbackData() {
    try {
        const [complaints, feedbacks] = await Promise.all([getComplaints(), getMyFeedback()]);
        const feedbackComplaintIds = new Set(feedbacks.map(f => f.complaint_id));

        resolvedWithoutFeedback = complaints.filter(
            c => c.status === "resolved" && !feedbackComplaintIds.has(c.id)
        );

        submittedFeedbacks = feedbacks;
        renderPending();
        renderSubmitted(complaints);
    } catch (e) { console.error(e); }
}

function renderPending() {
    const el = document.getElementById("pending-feedback");
    if (!resolvedWithoutFeedback.length) {
        el.innerHTML = `<div class="empty-state"><h3>All caught up!</h3><p>No resolved complaints awaiting feedback.</p></div>`;
        return;
    }
    el.innerHTML = resolvedWithoutFeedback.map(c => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #f5f5f5;">
            <div>
                <strong style="font-size:14px;">${c.complaint_number}</strong>
                <span style="color:#555;font-size:13px;margin-left:10px;">${c.title}</span>
            </div>
            <button class="btn btn-primary btn-sm" onclick="openFeedbackModal(${c.id}, '${c.title.replace(/'/g,"\\'")}')">Rate Now</button>
        </div>
    `).join("");
}

function renderSubmitted(complaints) {
    const el = document.getElementById("submitted-feedback");
    if (!submittedFeedbacks.length) {
        el.innerHTML = `<p style="color:#888;font-size:14px;">No feedback submitted yet.</p>`;
        return;
    }
    const complaintMap = Object.fromEntries(complaints.map(c => [c.id, c]));
    el.innerHTML = `<table><thead><tr><th>Complaint</th><th>Rating</th><th>Comments</th><th>Date</th></tr></thead><tbody>
        ${submittedFeedbacks.map(f => {
            const c = complaintMap[f.complaint_id] || {};
            const stars = "★".repeat(f.rating) + "☆".repeat(5 - f.rating);
            return `<tr>
                <td><strong>${c.complaint_number || "#"+f.complaint_id}</strong><br><span style="font-size:12px;color:#777;">${c.title || ""}</span></td>
                <td><span style="color:#fbbc04;font-size:18px;">${stars}</span> <span style="font-size:13px;color:#555;">(${f.rating}/5)</span></td>
                <td style="font-size:13px;color:#555;">${f.comments || "—"}</td>
                <td style="font-size:12px;color:#888;">${new Date(f.created_at).toLocaleDateString()}</td>
            </tr>`;
        }).join("")}
    </tbody></table>`;
}

function openFeedbackModal(id, title) {
    document.getElementById("fb-complaint-id").value = id;
    document.getElementById("fb-complaint-title").textContent = title;
    document.querySelectorAll('input[name="rating"]').forEach(r => r.checked = false);
    document.getElementById("fb-comments").value = "";
    document.getElementById("fb-alert").innerHTML = "";
    document.getElementById("feedback-modal").classList.add("active");
}

function closeFeedbackModal() { document.getElementById("feedback-modal").classList.remove("active"); }

async function submitFeedbackForm() {
    const complaintId = parseInt(document.getElementById("fb-complaint-id").value);
    const ratingEl = document.querySelector('input[name="rating"]:checked');
    const comments = document.getElementById("fb-comments").value;
    const alertEl = document.getElementById("fb-alert");

    if (!ratingEl) {
        alertEl.innerHTML = `<div class="alert alert-error">Please select a rating</div>`;
        return;
    }

    try {
        const data = await submitFeedback(complaintId, parseInt(ratingEl.value), comments);
        if (data.id) {
            alertEl.innerHTML = `<div class="alert alert-success">Feedback submitted! Thank you.</div>`;
            setTimeout(() => { closeFeedbackModal(); loadFeedbackData(); }, 1200);
        } else {
            alertEl.innerHTML = `<div class="alert alert-error">${data.detail || "Submission failed"}</div>`;
        }
    } catch (e) {
        alertEl.innerHTML = `<div class="alert alert-error">Something went wrong</div>`;
    }
}

document.getElementById("feedback-modal").addEventListener("click", e => {
    if (e.target === document.getElementById("feedback-modal")) closeFeedbackModal();
});
</script>
</body>
</html>
